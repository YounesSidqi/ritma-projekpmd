services:
  web:
    build: .
    container_name: ritma-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: ritma-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ritma_db
    ports:
      - "3307:3306"
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ritma-phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8085:80"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge